services:
  - type: web
    name: sprintern-api
    runtime: docker
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    dockerfilePath: ./backend/Dockerfile.api
    dockerContext: ./backend
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health/ready
    envVars:
      - fromGroup: sprintern-backend

  - type: worker
    name: sprintern-scheduler
    runtime: docker
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    dockerfilePath: ./backend/Dockerfile.api
    dockerContext: ./backend
    dockerCommand: python -m api.scheduler
    envVars:
      - fromGroup: sprintern-backend

  - type: worker
    name: sprintern-worker
    runtime: docker
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    dockerfilePath: ./backend/Dockerfile.api
    dockerContext: ./backend
    dockerCommand: python -m api.worker
    envVars:
      - fromGroup: sprintern-backend
